<!DOCTYPE html>
{% load bootstrap5 %}
{% load static %}
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'nyatuwarga_blue.png' %}" type="image/x-icon">
    
    {% bootstrap_css %}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, .btn {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .bg-origin-blue {
            background-color: #3b82f6;
        }
        
        .form-control.rounded-pill {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .form-label-custom {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .link-primary {
            color: #3b82f6;
        }
        
        .link-primary:hover {
            color: #2563eb;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-4">

    <div class="container-fluid" style="max-width: 56rem;">
        <div class="card shadow-lg border-0 rounded-3 overflow-hidden">
            <div class="row g-0">
                
                <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white text-center p-5 bg-origin-blue">
                    <img src="{% static 'nyatuwarga_white.png' %}" class="w-16 h-16" width="280" height="280" viewBox="0 0 24 24">
                </div>
                
                <div class="col-md-6 p-4 p-sm-5">
                    <div class="d-flex flex-column justify-content-center h-100">
                        {% if messages %}
                        <div class="mb-3">
                            {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            {% endfor %}
                        </div>
                        {% endif %}
                        {% block content %}{% endblock %}
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% bootstrap_javascript %}
</body>
</html>
