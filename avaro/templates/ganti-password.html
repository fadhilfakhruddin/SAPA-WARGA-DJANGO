{% extends "index_base.html" %}
{% load bootstrap5 %}
{% block title %} Ganti Password {% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            
            <div class="d-flex align-items-center mb-4">
                <a href="javascript:history.back()" class="btn btn-light rounded-circle p-2 me-3 shadow-sm border d-flex align-items-center">
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
                </a>
                <div>
                    <h2 class="h4 mb-0 fw-bold" style="color: #1E293B;">Ganti Password</h2>
                    <p class="text-muted small mb-0">Buat password baru yang kuat.</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    {% bootstrap_messages %}
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {% bootstrap_form form %}
                        
                        <div class="mt-4 pt-2 border-top border-light-subtle">
                            <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-medium shadow-sm d-flex justify-content-center align-items-center gap-2">
                                <span class="material-symbols-outlined" style="font-size: 20px;">save</span>
                                Perbarui Password
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
{% endblock %}
